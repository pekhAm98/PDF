services:
  postgres:
    image: postgres:15.3
    container_name: ai-rag-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_companion

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-rag-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  ollama:
      image: ollama/ollama:rocm
      container_name: ai-rag-ollama

      restart: unless-stopped

      ports:
        - "11434:11434"

      volumes:
        - ollama_data:/root/.ollama

      devices:
        - /dev/dxg:/dev/dxg

      environment:
        - HSA_OVERRIDE_GFX_VERSION=12.0.1
        - ROCR_VISIBLE_DEVICES=0

  qdrant:
    image: qdrant/qdrant
    container_name: ai-rag-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  qdrant_data:
